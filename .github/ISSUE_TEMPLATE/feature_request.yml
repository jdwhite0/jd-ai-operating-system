name: "💡 Feature / idea"
description: Suggest an improvement or something you'd love to see.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like JD AI OS to do?
      placeholder: "It would be great if..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      placeholder: "Right now I have to... which means..."
  - type: dropdown
    id: area
    attributes:
      label: Where does this idea fit?
      options:
        - First-run / onboarding
        - Toolchain / EgoLite
        - Personal OS (`os/`)
        - Deploy (Vercel)
        - Docs
        - Not sure
